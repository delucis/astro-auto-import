name: CI
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Automatically cancel in-progress actions on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        astro: [^5, ^6, ^7]
        processor: [default]
        include:
          - os: ubuntu-latest
            astro: ^7
            processor: unified
          - os: windows-latest
            astro: ^7
            processor: unified
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install Dependencies
        run: pnpm i

      - run: pnpm i --workspace-root astro@${{ matrix.astro }}
      - run: pnpm i astro@${{ matrix.astro }}
        working-directory: packages/astro-auto-import
      - run: pnpm i astro@${{ matrix.astro }} @astrojs/mdx@${{ env.MDX_VERSION }}
        env:
          MDX_VERSION: ${{ matrix.astro == '^5' && '^4' || matrix.astro == '^6' && '^5' || '^7' }}
        working-directory: demo
      - if: matrix.astro == '^5'
        run: pnpm un @astrojs/markdown-remark
        working-directory: demo

      - name: Test
        run: pnpm t
        env:
          MARKDOWN_PROCESSOR: ${{ matrix.processor }}
